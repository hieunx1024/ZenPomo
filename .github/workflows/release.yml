name: Release ZenPomo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$VERSION" = "" ] && VERSION="1.0.0"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Static Linux AMD64 Binary & Debian Package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo-linux-amd64 main.go
          make deb VERSION=$VERSION
          mv dist/zenpomo_${VERSION}_amd64.deb dist/zenpomo_${VERSION}_linux_amd64.deb || true

      - name: Build Static Linux ARM64 Binary
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo-linux-arm64 main.go

      - name: Build Windows AMD64 Executable
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo-windows-amd64.exe main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ZenPomo Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/zenpomo-linux-amd64
            dist/zenpomo-linux-arm64
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_linux_amd64.deb
            dist/zenpomo-windows-amd64.exe
