name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: zenpomo_linux_amd64
          - os: linux
            arch: arm64
            output: zenpomo_linux_arm64
          - os: windows
            arch: amd64
            output: zenpomo_windows_amd64.exe

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/${{ matrix.output }} main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Archives
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          # Linux AMD64
          cp release-artifacts/zenpomo_linux_amd64/zenpomo_linux_amd64 dist/zenpomo
          tar -czf dist/zenpomo_${VERSION}_linux_amd64.tar.gz -C dist zenpomo && rm dist/zenpomo

          # Linux ARM64
          cp release-artifacts/zenpomo_linux_arm64/zenpomo_linux_arm64 dist/zenpomo
          tar -czf dist/zenpomo_${VERSION}_linux_arm64.tar.gz -C dist zenpomo && rm dist/zenpomo

          # Windows AMD64
          cp release-artifacts/zenpomo_windows_amd64.exe/zenpomo_windows_amd64.exe dist/zenpomo.exe
          zip -j dist/zenpomo_${VERSION}_windows_amd64.zip dist/zenpomo.exe && rm dist/zenpomo.exe

          # Generate Checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
