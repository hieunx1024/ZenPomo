name: Release ZenPomo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install NSIS for Windows Installer
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$VERSION" = "" ] && VERSION="1.0.0"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build All Artifacts
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p dist bin

          # 1. Linux AMD64 Binary
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo_${VERSION}_linux_amd64 main.go

          # 2. Linux ARM64 Binary
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo_${VERSION}_linux_arm64 main.go

          # 3. Windows AMD64 Executable (Portable)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/zenpomo_${VERSION}_windows_amd64.exe main.go
          cp dist/zenpomo_${VERSION}_windows_amd64.exe bin/zenpomo.exe

          # 4. Windows Setup Installer (.exe) via NSIS
          makensis -DVERSION=$VERSION packaging/windows/zenpomo.nsi

          # 5. Debian / Ubuntu Package
          make deb VERSION=$VERSION
          mv dist/zenpomo_${VERSION}_amd64.deb dist/zenpomo_${VERSION}_linux_amd64.deb || true

          # 6. Generate SHA256 Checksums
          cd dist
          sha256sum zenpomo_${VERSION}_* > checksums_${VERSION}.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ZenPomo Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_windows_setup.exe
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_windows_amd64.exe
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_linux_amd64.deb
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_linux_amd64
            dist/zenpomo_${{ steps.get_version.outputs.VERSION }}_linux_arm64
            dist/checksums_${{ steps.get_version.outputs.VERSION }}.txt
